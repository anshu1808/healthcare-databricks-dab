# This is a Declarative Automation Bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_project
  uuid: a36d509c-f99f-4940-bbfa-cb3c671387d0

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-23c305ec-be26.cloud.databricks.com
    variables:
      catalog: main
      schema: healthcare_project_pipe_dev
  qa:
    mode: production
    workspace:
      host: https://dbc-23c305ec-be26.cloud.databricks.com
    variables:
      catalog: main
      schema: qhealthcare_project_pipe_qa
  prod:
    mode: production
    workspace:
      host: https://dbc-23c305ec-be26.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/anshu.accent@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/anshu.accent@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: main
      schema: healthcare_project_pipe_prod
    permissions:
      - user_name: anshu.accent@gmail.com
        level: CAN_MANAGE
